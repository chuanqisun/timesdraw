<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>timesdraw</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background: #000;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      canvas {
        background: #000;
        border: 1px solid #333;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script src="app.js"></script>
  </body>
</html>
