<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>" />
    <title>timesdraw</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background: #000;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      canvas {
        max-width: 95vw;
        max-height: 95dvh;
        background: #000;
        border: 1px solid #333;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1080" height="1920"></canvas>
    <script src="app.js"></script>
  </body>
</html>
