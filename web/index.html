<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>timesdraw</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background: #000;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #888;
        font: 12px monospace;
        pointer-events: none;
      }
      canvas {
        max-width: 95vw;
        max-height: 95dvh;
        background: #000;
        border: 1px solid #333;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <canvas id="canvas" width="1080" height="1920"></canvas>
    <script src="app.js"></script>
  </body>
</html>
