[package]
name = "timestral-wasm"
version = "0.1.0"
edition = "2021"
description = "Timestral inference in plain Rust, built for the browser as wasm with SIMD128"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
